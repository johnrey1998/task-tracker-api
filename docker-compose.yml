services:
  db:
    image: postgres:18
    container_name: task-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: task_tracker
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build: .
    container_name: task-tracker-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://admin:password@db:5432/task_tracker
      JWT_SECRET: change-this-in-prod
    ports:
      - "8000:8000"
    depends_on:
      - db
volumes:
  pgdata: