[project]
name = "task-tracker-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "johnrey1998", email = "johnrey1998@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "bcrypt>=5.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "pyjwt>=2.13.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
task-api = "task_tracker_api:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
