[project]
name = "task-tracker-api"
version = "0.1.0"
description = "Task Tracker API"
readme = "README.md"
authors = [
    { name = "johnrey1998", email = "johnrey1998@yahoo.com" }
]
requires-python = ">=3.14"
dependencies = [
    "psycopg>=3.3.5",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "sqlalchemy>=2.0.52",
    "pyjwt>=2.14.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
